<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadiya Shop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172033;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:24px}header p{margin:6px 0 0;font-size:13px;color:#d1d5db}
.wrap{max-width:720px;margin:auto;padding:14px}.hero,.orderbox,.card{background:#fff;border-radius:18px;box-shadow:0 4px 18px #00000012;margin-bottom:16px}
.hero{text-align:center;padding:20px}.hero h2{margin:0 0 7px}.hero p{margin:0;color:#666}
.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{overflow:hidden}.card img{width:100%;height:210px;object-fit:cover;display:block}.body{padding:14px}.body h3{margin:0 0 8px;font-size:20px}.desc{color:#666;font-size:14px;min-height:38px}.price{font-size:22px;font-weight:700;margin:10px 0}.stock{color:#159447;font-size:13px;margin-bottom:10px}
button{border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}.orderbtn{width:100%;background:#111827;color:#fff}.orderbox{padding:18px}.selected{background:#f1f3f5;padding:12px;border-radius:12px;margin-bottom:12px;font-weight:700}
label{display:block;margin:10px 0 6px;font-weight:600}input,textarea,select{width:100%;padding:13px;border:1px solid #d5d8de;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:90px;resize:vertical}.confirm{width:100%;background:#16a34a;color:#fff;margin-top:14px;font-weight:700}.msg{margin-top:14px;padding:16px;border-radius:14px;background:#dcfce7;color:#166534;display:none}.error{background:#fee2e2;color:#991b1b}.total{font-size:20px;font-weight:700;margin-top:12px}footer{text-align:center;color:#888;padding:25px;font-size:12px}
.empty{text-align:center;color:#777;padding:20px}
</style>
</head>
<body>
<header><h1>🛍️ Sadiya Shop</h1><p>আপনার পছন্দের পণ্য, সহজে অর্ডার করুন</p></header>
<main class="wrap">
<section class="hero"><h2>আমাদের জনপ্রিয় পণ্য</h2><p>পছন্দের পণ্যটি বেছে নিয়ে অর্ডার করুন</p></section>
<section id="products" class="grid"></section>

<section class="orderbox" id="orderBox">
<h2>🛒 অর্ডার করুন</h2>
<div id="selected" class="selected">আগে একটি product নির্বাচন করুন</div>
<label>আপনার নাম</label><input id="name" placeholder="আপনার নাম">
<label>মোবাইল নম্বর</label><input id="phone" inputmode="tel" placeholder="01XXXXXXXXX">
<label>সম্পূর্ণ ডেলিভারি ঠিকানা</label><textarea id="address" placeholder="বাড়ি, রোড/গ্রাম, থানা, জেলা"></textarea>
<label>Quantity</label><select id="qty"></select>
<div id="total" class="total"></div>
<button class="confirm" onclick="placeOrder()">অর্ডার Confirm করুন</button>
<div id="message" class="msg"></div>
</section>
</main>
<footer>© 2026 Sadiya Shop<br>All Rights Reserved</footer>

<script>
const SUPABASE_URL="https://kbseaoddhrtwdjfrkzit.supabase.co";
const SUPABASE_KEY="sb_publishable_eShe9Sd6uQoHLvBUhAD9hQ__fioN6zU";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[], selected=null;

async function loadProducts(){
  const {data,error}=await db.from("products").select("*").eq("active",true).order("id",{ascending:true});
  const box=document.getElementById("products");
  if(error){box.innerHTML='<div class="empty">পণ্য লোড করা যাচ্ছে না।</div>';return}
  products=data||[];
  if(!products.length){box.innerHTML='<div class="empty">এই মুহূর্তে কোনো পণ্য নেই।</div>';return}
  box.innerHTML=products.map(p=>`
    <article class="card">
      <img src="${escapeAttr(p.image_url||"")}" alt="${escapeAttr(p.name||"Product")}" onerror="this.style.display='none'">
      <div class="body">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="desc">${escapeHtml(p.description||"")}</div>
        <div class="price">৳${Number(p.price).toLocaleString("bn-BD")}</div>
        <div class="stock">${Number(p.stock)>0?"স্টক আছে":"স্টক শেষ"}</div>
        <button class="orderbtn" ${Number(p.stock)<=0?"disabled":""} onclick="selectProduct('${p.id}')">অর্ডার করুন</button>
      </div>
    </article>`).join("");
}
function selectProduct(id){
  selected=products.find(p=>String(p.id)===String(id));
  document.getElementById("selected").textContent=`নির্বাচিত পণ্য: ${selected.name} — ৳${selected.price}`;
  const q=document.getElementById("qty"); q.innerHTML="";
  const max=Math.min(Number(selected.stock)||0,20);
  for(let i=1;i<=max;i++){let o=document.createElement("option");o.value=i;o.textContent="Quantity: "+i;q.appendChild(o)}
  updateTotal();
  document.getElementById("orderBox").scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("qty").addEventListener("change",updateTotal);
function updateTotal(){
  if(!selected)return document.getElementById("total").textContent="";
  const q=Number(document.getElementById("qty").value||1);
  document.getElementById("total").textContent=`মোট: ৳${(Number(selected.price)*q).toLocaleString("bn-BD")}`;
}
async function placeOrder(){
  const msg=document.getElementById("message");msg.style.display="none";msg.className="msg";
  if(!selected)return showMsg("আগে একটি পণ্য নির্বাচন করুন।",true);
  const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),qty=Number(document.getElementById("qty").value||0);
  if(name.length<2)return showMsg("আপনার নাম দিন।",true);
  if(!/^01[3-9]\d{8}$/.test(phone))return showMsg("সঠিক মোবাইল নম্বর দিন।",true);
  if(address.length<6)return showMsg("সম্পূর্ণ ডেলিভারি ঠিকানা দিন।",true);
  if(qty<1||qty>Number(selected.stock))return showMsg("এই পরিমাণ পণ্য স্টকে নেই।",true);

  const total=Number(selected.price)*qty;
  const {error}=await db.from("orders").insert({
    customer_name:name,phone,address,product_name:selected.name,quantity:qty,total,status:"New"
  });
  if(error)return showMsg("অর্ডার নেওয়া যায়নি। আবার চেষ্টা করুন।",true);

  // Stock decrement is intentionally not done from the public browser.
  // Admin can update stock after confirming the order.
  showMsg(`✅ অর্ডার সফলভাবে গ্রহণ করা হয়েছে!<br><br>পণ্য: ${escapeHtml(selected.name)}<br>Quantity: ${qty}<br>মোট: ৳${total.toLocaleString("bn-BD")}<br><br>আমরা খুব শীঘ্রই আপনার সাথে যোগাযোগ করব।`);
  document.getElementById("name").value="";document.getElementById("phone").value="";document.getElementById("address").value="";
}
function showMsg(t,err=false){const m=document.getElementById("message");m.innerHTML=t;m.className="msg"+(err?" error":"");m.style.display="block"}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function escapeAttr(v){return escapeHtml(v)}
loadProducts();
</script>
</body>
</html>
