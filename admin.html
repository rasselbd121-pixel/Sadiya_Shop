<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Sadiya Shop - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
    }

    header .top {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 22px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .login {
      max-width: 430px;
      margin: 50px auto;
    }

    h2 {
      margin-bottom: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #111827;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    .gray {
      background: #e5e7eb;
      color: #111827;
    }

    .logout {
      background: #dc2626;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .product-body {
      padding: 13px;
    }

    .product-body h3 {
      margin-bottom: 7px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
      margin: 8px 0;
    }

    .buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .buttons button {
      flex: 1;
      min-width: 75px;
    }

    .order {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .order strong {
      font-size: 17px;
    }

    .order-line {
      margin-top: 6px;
      color: #4b5563;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
    }

    .stat-number {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    @media(max-width: 750px) {
      .product-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <h1>🛍️ Sadiya Shop Admin</h1>

    <button
      id="logoutButton"
      class="logout hidden"
      onclick="logout()">
      Logout
    </button>
  </div>
</header>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="container">

  <div class="card login">

    <h2>🔐 Admin Login</h2>

    <div id="loginError" class="message error"></div>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email">

    <input
      type="password"
      id="loginPassword"
      placeholder="Password">

    <button
      class="primary"
      style="width:100%;"
      onclick="login()">
      Login
    </button>

  </div>

</div>


<!-- ================= ADMIN PANEL ================= -->

<div id="adminPage" class="container hidden">

  <div id="adminMessage" class="message"></div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div
        class="stat-number"
        id="productCount">
        0
      </div>
      Products
    </div>

    <div class="stat">
      <div
        class="stat-number"
        id="orderCount">
        0
      </div>
      Orders
    </div>

    <div class="stat">
      <div
        class="stat-number"
        id="newOrderCount">
        0
      </div>
      New Orders
    </div>

  </div>


  <!-- PRODUCT FORM -->

  <div class="card">

    <h2 id="formTitle">➕ Add Product</h2>

    <input
      type="hidden"
      id="productId">

    <div class="form-grid">

      <div>
        <label>Product Name</label>

        <input
          type="text"
          id="productName"
          placeholder="যেমন: Premium Face Wash">
      </div>


      <div>
        <label>Price</label>

        <input
          type="number"
          id="productPrice"
          placeholder="450">
      </div>


      <div>
        <label>Stock</label>

        <input
          type="number"
          id="productStock"
          placeholder="100">
      </div>


      <div>
        <label>Image URL</label>

        <input
          type="url"
          id="productImage"
          placeholder="https://...">
      </div>


      <div class="full">

        <label>Description</label>

        <textarea
          id="productDescription"
          placeholder="Product সম্পর্কে লিখুন"></textarea>

      </div>


      <div>

        <label>Status</label>

        <select id="productActive">

          <option value="true">
            Active
          </option>

          <option value="false">
            Hidden
          </option>

        </select>

      </div>

    </div>


    <div class="buttons">

      <button
        class="green"
        onclick="saveProduct()">
        💾 Save Product
      </button>

      <button
        class="gray"
        onclick="clearProductForm()">
        Clear
      </button>

    </div>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>📦 Products</h2>

    <div
      id="products"
      class="product-grid">
    </div>

  </div>


  <!-- ORDERS -->

  <div class="card">

    <h2>📋 Customer Orders</h2>

    <div
      id="orders">
      Loading orders...
    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
   ========================================= */

const SUPABASE_URL =
  "https://kbseaoddhrtwdjfrkzit.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eShe9Sd6uQoHLvBUhAD9hQ__fioN6zU";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   LOGIN
   ========================================= */

async function login() {

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const error =
    document.getElementById(
      "loginError"
    );


  error.style.display = "none";


  if (!email || !password) {

    showLoginError(
      "Email এবং password দিন।"
    );

    return;
  }


  const {
    data,
    error: loginError
  } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (loginError) {

    showLoginError(
      "Login failed: " +
      loginError.message
    );

    return;
  }


  if (!data.session) {

    showLoginError(
      "Login session পাওয়া যায়নি।"
    );

    return;
  }


  /* Check admin permission */

  const {
    data: admin,
    error: adminError
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.user.id)
      .maybeSingle();


  if (adminError || !admin) {

    await supabaseClient.auth.signOut();

    showLoginError(
      "এই account-এর Admin permission নেই।"
    );

    return;
  }


  openAdminPanel();

}


/* =========================================
   LOGIN ERROR
   ========================================= */

function showLoginError(message) {

  const box =
    document.getElementById(
      "loginError"
    );

  box.innerText = message;

  box.style.display = "block";

}


/* =========================================
   OPEN ADMIN
   ========================================= */

async function openAdminPanel() {

  document
    .getElementById("loginPage")
    .classList.add("hidden");


  document
    .getElementById("adminPage")
    .classList.remove("hidden");


  document
    .getElementById("logoutButton")
    .classList.remove("hidden");


  await loadProducts();

  await loadOrders();

}


/* =========================================
   LOGOUT
   ========================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================================
   LOAD PRODUCTS
   ========================================= */

async function loadProducts() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id", {
        ascending: true
      });


  if (error) {

    showAdminMessage(
      "Product load error: " +
      error.message,
      true
    );

    return;
  }


  document.getElementById(
    "productCount"
  ).innerText = data.length;


  renderProducts(data);

}


/* =========================================
   RENDER PRODUCTS
   ========================================= */

function renderProducts(products) {

  const container =
    document.getElementById(
      "products"
    );


  container.innerHTML = "";


  if (!products.length) {

    container.innerHTML =
      "<p>কোনো product নেই।</p>";

    return;
  }


  products.forEach(product => {

    const card =
      document.createElement("div");

    card.className = "product";


    const image =
      product.image_url ||
      "https://via.placeholder.com/800x600?text=No+Image";


    card.innerHTML = `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(product.name)}">

      <div class="product-body">

        <h3>
          ${escapeHtml(product.name)}
        </h3>

        <div class="price">
          ৳${Number(product.price).toFixed(0)}
        </div>

        <div>
          Stock: ${product.stock}
        </div>

        <div style="margin-top:5px;">
          Status:
          <strong>
            ${product.active ? "Active" : "Hidden"}
          </strong>
        </div>

        <div class="buttons">

          <button
            class="primary"
            onclick='editProduct(${JSON.stringify(product)})'>
            ✏️ Edit
          </button>

          <button
            class="${product.active ? "gray" : "green"}"
            onclick="toggleProduct(${product.id}, ${product.active})">
            ${product.active ? "Hide" : "Show"}
          </button>

          <button
            class="red"
            onclick="deleteProduct(${product.id})">
            🗑️ Delete
          </button>

        </div>

      </div>
    `;


    container.appendChild(card);

  });

}


/* =========================================
   SAVE PRODUCT
   ========================================= */

async function saveProduct() {

  const id =
    document.getElementById(
      "productId"
    ).value;


  const name =
    document.getElementById(
      "productName"
    ).value.trim();


  const description =
    document.getElementById(
      "productDescription"
    ).value.trim();


  const price =
    Number(
      document.getElementById(
        "productPrice"
      ).value
    );


  const image_url =
    document.getElementById(
      "productImage"
    ).value.trim();


  const stock =
    Number(
      document.getElementById(
        "productStock"
      ).value
    );


  const active =
    document.getElementById(
      "productActive"
    ).value === "true";


  if (!name) {

    showAdminMessage(
      "Product name দিন।",
      true
    );

    return;
  }


  if (price < 0 || stock < 0) {

    showAdminMessage(
      "Price এবং stock সঠিক দিন।",
      true
    );

    return;
  }


  const productData = {

    name,
    description,
    price,
    image_url,
    stock,
    active,

    updated_at:
      new Date().toISOString()

  };


  let result;


  if (id) {

    result =
      await supabaseClient
        .from("products")
        .update(productData)
        .eq("id", Number(id));

  } else {

    result =
      await supabaseClient
        .from("products")
        .insert(productData);

  }


  if (result.error) {

    showAdminMessage(
      "Save error: " +
      result.error.message,
      true
    );

    return;
  }


  showAdminMessage(
    id
      ? "✅ Product updated!"
      : "✅ Product added!"
  );


  clearProductForm();

  await loadProducts();

}


/* =========================================
   EDIT PRODUCT
   ========================================= */

function editProduct(product) {

  document.getElementById(
    "productId"
  ).value = product.id;


  document.getElementById(
    "productName"
  ).value = product.name || "";


  document.getElementById(
    "productDescription"
  ).value =
    product.description || "";


  document.getElementById(
    "productPrice"
  ).value = product.price;


  document.getElementById(
    "productImage"
  ).value =
    product.image_url || "";


  document.getElementById(
    "productStock"
  ).value = product.stock;


  document.getElementById(
    "productActive"
  ).value =
    product.active ? "true" : "false";


  document.getElementById(
    "formTitle"
  ).innerText =
    "✏️ Edit Product";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================
   CLEAR FORM
   ========================================= */

function clearProductForm() {

  document.getElementById(
    "productId"
  ).value = "";


  document.getElementById(
    "productName"
  ).value = "";


  document.getElementById(
    "productDescription"
  ).value = "";


  document.getElementById(
    "productPrice"
  ).value = "";


  document.getElementById(
    "productImage"
  ).value = "";


  document.getElementById(
    "productStock"
  ).value = "";


  document.getElementById(
    "productActive"
  ).value = "true";


  document.getElementById(
    "formTitle"
  ).innerText =
    "➕ Add Product";

}


/* =========================================
   HIDE / SHOW PRODUCT
   ========================================= */

async function toggleProduct(
  id,
  currentStatus
) {

  const {
    error
  } =
    await supabaseClient
      .from("products")
      .update({
        active: !currentStatus,
        updated_at:
          new Date().toISOString()
      })
      .eq("id", id);


  if (error) {

    showAdminMessage(
      error.message,
      true
    );

    return;
  }


  await loadProducts();

}


/* =========================================
   DELETE PRODUCT
   ========================================= */

async function deleteProduct(id) {

  const confirmed =
    confirm(
      "এই product delete করতে চান?"
    );


  if (!confirmed) return;


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    showAdminMessage(
      "Delete error: " +
      error.message,
      true
    );

    return;
  }


  showAdminMessage(
    "✅ Product deleted!"
  );


  await loadProducts();

}


/* =========================================
   LOAD ORDERS
   ========================================= */

async function loadOrders() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    showAdminMessage(
      "Order load error: " +
      error.message,
      true
    );

    return;
  }


  document.getElementById(
    "orderCount"
  ).innerText = data.length;


  document.getElementById(
    "newOrderCount"
  ).innerText =
    data.filter(
      order => order.status === "new"
    ).length;


  renderOrders(data);

}


/* =========================================
   RENDER ORDERS
   ========================================= */

function renderOrders(orders) {

  const container =
    document.getElementById(
      "orders"
    );


  container.innerHTML = "";


  if (!orders.length) {

    container.innerHTML =
      "<p>এখনো কোনো order আসেনি।</p>";

    return;
  }


  orders.forEach(order => {

    const div =
      document.createElement("div");

    div.className = "order";


    div.innerHTML = `

      <strong>
        🧾 Order #${order.id}
      </strong>

      <div class="order-line">
        👤 ${escapeHtml(order.customer_name)}
      </div>

      <div class="order-line">
        📞 ${escapeHtml(order.phone)}
      </div>

      <div class="order-line">
        📍 ${escapeHtml(order.address)}
      </div>

      <div class="order-line">
        🛍️ ${escapeHtml(order.product_name)}
      </div>

      <div class="order-line">
        Quantity: ${order.quantity}
      </div>

      <div class="order-line">
        💰 Total: ৳${Number(order.total_amount).toFixed(0)}
      </div>

      <div class="order-line">
        📅 ${formatDate(order.created_at)}
      </div>

      <div style="margin-top:12px;">

        <select
          onchange="changeOrderStatus(${order.id}, this.value)">

          <option
            value="new"
            ${order.status === "new" ? "selected" : ""}>
            New
          </option>

          <option
            value="confirmed"
            ${order.status === "confirmed" ? "selected" : ""}>
            Confirmed
          </option>

          <option
            value="processing"
            ${order.status === "processing" ? "selected" : ""}>
            Processing
          </option>

          <option
            value="shipped"
            ${order.status === "shipped" ? "selected" : ""}>
            Shipped
          </option>

          <option
            value="delivered"
            ${order.status === "delivered" ? "selected" : ""}>
            Delivered
          </option>

          <option
            value="cancelled"
            ${order.status === "cancelled" ? "selected" : ""}>
            Cancelled
          </option>

        </select>

      </div>
    `;


    container.appendChild(div);

  });

}


/* =========================================
   CHANGE ORDER STATUS
   ========================================= */

async function changeOrderStatus(
  orderId,
  status
) {

  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .update({
        status: status,
        updated_at:
          new Date().toISOString()
      })
      .eq("id", orderId);


  if (error) {

    showAdminMessage(
      "Status update error: " +
      error.message,
      true
    );

    return;
  }


  showAdminMessage(
    "✅ Order status updated!"
  );


  await loadOrders();

}


/* =========================================
   DATE
   ========================================= */

function formatDate(date) {

  return new Date(date)
    .toLocaleString(
      "bn-BD",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

}


/* =========================================
   ADMIN MESSAGE
   ========================================= */

function showAdminMessage(
  message,
  isError = false
) {

  const box =
    document.getElementById(
      "adminMessage"
    );


  box.innerText = message;

  box.className =
    "message " +
    (isError ? "error" : "success");


  box.style.display = "block";


  setTimeout(() => {

    box.style.display = "none";

  }, 4000);

}


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   CHECK EXISTING SESSION
   ========================================= */

async function checkSession() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (!data.session) {
    return;
  }


  const {
    data: admin
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq(
        "user_id",
        data.session.user.id
      )
      .maybeSingle();


  if (admin) {

    openAdminPanel();

  }

}


/* START */

checkSession();

</script>

</body>
</html>
