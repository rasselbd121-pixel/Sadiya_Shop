<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadiya Shop Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:21px}button{border:0;border-radius:9px;padding:11px 14px;font-size:15px;cursor:pointer}.logout{background:#dc2626;color:#fff}.wrap{max-width:900px;margin:auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.panel,.product{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 15px #00000010}.stat{text-align:center}.stat b{display:block;font-size:28px}.panel{margin-bottom:16px}.panel h2{margin-top:0}
label{display:block;font-weight:600;margin:9px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}textarea{min-height:90px}.save{background:#16a34a;color:#fff;width:100%;margin-top:12px}.clear{background:#e5e7eb;width:100%;margin-top:8px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.product{overflow:hidden}.product img{width:100%;height:190px;object-fit:cover;border-radius:10px}.product h3{margin:10px 0 5px}.muted{color:#666;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.edit{background:#111827;color:#fff}.hide{background:#e5e7eb}.delete{background:#dc2626;color:#fff}.order{border:1px solid #ddd;border-radius:12px;padding:13px;margin-top:10px}.order select{margin-top:10px}.login{max-width:420px;margin:50px auto}.hidden{display:none}.danger{color:#b91c1c}.msg{padding:12px;border-radius:10px;margin:10px 0;background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/3}.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🛍️ Sadiya Shop Admin</h1><button class="logout" onclick="logout()">Logout</button></header>

<main class="wrap">
<section id="loginBox" class="panel login">
<h2>Admin Login</h2>
<div id="loginMsg"></div>
<label>Email</label><input id="email" type="email" placeholder="Admin email">
<label>Password</label><input id="password" type="password" placeholder="Password">
<button class="save" onclick="login()">Login</button>
</section>

<section id="dashboard" class="hidden">
<div class="stats">
<div class="stat"><b id="productCount">0</b>Products</div>
<div class="stat"><b id="orderCount">0</b>Orders</div>
<div class="stat"><b id="newCount">0</b>New Orders</div>
</div>

<section class="panel">
<h2>➕ Add / Edit Product</h2>
<input id="editId" type="hidden">
<label>Product Name</label><input id="pname" placeholder="যেমন: Premium Face Wash">
<label>Price</label><input id="price" type="number" min="0" placeholder="500">
<label>Stock</label><input id="stock" type="number" min="0" placeholder="100">
<label>Image URL</label><input id="image" placeholder="https://...">
<label>Description</label><textarea id="description" placeholder="Product সম্পর্কে লিখুন"></textarea>
<label>Status</label><select id="active"><option value="true">Active</option><option value="false">Hidden</option></select>
<button class="save" onclick="saveProduct()">💾 Save Product</button>
<button class="clear" onclick="clearForm()">Clear</button>
<div id="productMsg"></div>
</section>

<section class="panel"><h2>📦 Products</h2><div id="products" class="products"></div></section>
<section class="panel"><h2>📋 Customer Orders</h2><div id="orders"></div></section>
</section>
</main>

<script>
const SUPABASE_URL="https://kbseaoddhrtwdjfrkzit.supabase.co";
const SUPABASE_KEY="sb_publishable_eShe9Sd6uQoHLvBUhAD9hQ__fioN6zU";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function init(){
 const {data:{session}}=await db.auth.getSession();
 if(session) await verifyAdmin(session.user.id); else showLogin();
}
async function verifyAdmin(uid){
 const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",uid).maybeSingle();
 if(error||!data){await db.auth.signOut();showLogin();showLoginMsg("এই account-এর admin access নেই।",true);return}
 document.getElementById("loginBox").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden");loadAll();
}
async function login(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error)return showLoginMsg("Login failed: "+error.message,true);
 await verifyAdmin(data.user.id);
}
async function logout(){await db.auth.signOut();location.reload()}
function showLogin(){document.getElementById("loginBox").classList.remove("hidden");document.getElementById("dashboard").classList.add("hidden")}
function showLoginMsg(t,e){document.getElementById("loginMsg").innerHTML=`<div class="msg ${e?"err":""}">${escapeHtml(t)}</div>`}
function showProductMsg(t,e=false){document.getElementById("productMsg").innerHTML=`<div class="msg ${e?"err":""}">${escapeHtml(t)}</div>`}

async function loadAll(){await loadProducts();await loadOrders()}
async function loadProducts(){
 const {data,error}=await db.from("products").select("*").order("id",{ascending:true});
 if(error){document.getElementById("products").innerHTML="<p>Products load error.</p>";return}
 document.getElementById("productCount").textContent=(data||[]).length;
 document.getElementById("products").innerHTML=(data||[]).map(p=>`
 <article class="product">
 <img src="${esc(p.image_url||"")}" onerror="this.style.display='none'">
 <h3>${esc(p.name)}</h3><div>৳${Number(p.price).toLocaleString("bn-BD")}</div>
 <div class="muted">Stock: ${p.stock}<br>Status: ${p.active?"Active":"Hidden"}</div>
 <div class="actions">
 <button class="edit" onclick='editProduct(${JSON.stringify(p)})'>✏️ Edit</button>
 <button class="hide" onclick="toggleProduct('${p.id}',${!p.active})">${p.active?"Hide":"Show"}</button>
 <button class="delete" onclick="deleteProduct('${p.id}')">🗑️ Delete</button>
 </div></article>`).join("");
}
function editProduct(p){
 editId.value=p.id;pname.value=p.name||"";price.value=p.price||"";stock.value=p.stock||0;image.value=p.image_url||"";description.value=p.description||"";active.value=String(!!p.active);scrollTo({top:0,behavior:"smooth"});
}
function clearForm(){editId.value="";pname.value="";price.value="";stock.value="100";image.value="";description.value="";active.value="true";productMsg.innerHTML=""}
async function saveProduct(){
 const name=pname.value.trim(),pr=Number(price.value),st=Number(stock.value),img=image.value.trim(),desc=description.value.trim(),isActive=active.value==="true";
 if(!name||pr<0||st<0)return showProductMsg("নাম, price এবং stock ঠিকভাবে দিন।",true);
 const payload={name,price:pr,stock:st,image_url:img,description:desc,active:isActive};
 let result;
 if(editId.value) result=await db.from("products").update(payload).eq("id",editId.value);
 else result=await db.from("products").insert(payload);
 if(result.error)return showProductMsg(result.error.message,true);
 showProductMsg(editId.value?"Product updated.":"Product added.");clearForm();loadProducts();
}
async function toggleProduct(id,val){const {error}=await db.from("products").update({active:val}).eq("id",id);if(error)alert(error.message);loadProducts()}
async function deleteProduct(id){if(!confirm("এই product delete করবেন?"))return;const {error}=await db.from("products").delete().eq("id",id);if(error)alert(error.message);loadProducts()}
async function loadOrders(){
 const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
 if(error){orders.innerHTML="<p>Orders load error.</p>";return}
 orderCount.textContent=(data||[]).length;newCount.textContent=(data||[]).filter(o=>(o.status||"New")==="New").length;
 orders.innerHTML=(data||[]).length?(data||[]).map(o=>`
 <div class="order">
 <b>🧾 Order #${esc(o.id)}</b><br>
 👤 ${esc(o.customer_name)}<br>
 📞 ${esc(o.phone)}<br>
 📍 ${esc(o.address)}<br>
 🛍️ ${esc(o.product_name)}<br>
 Quantity: ${o.quantity}<br>
 💰 Total: ৳${Number(o.total).toLocaleString("bn-BD")}<br>
 <small>${o.created_at?new Date(o.created_at).toLocaleString("bn-BD"):""}</small>
 <select onchange="changeStatus('${o.id}',this.value)">
 ${["New","Confirmed","Processing","Shipped","Delivered","Cancelled"].map(s=>`<option ${String(o.status||"New")===s?"selected":""}>${s}</option>`).join("")}
 </select>
 </div>`).join(""):"<p>এখন কোনো order আসেনি।</p>";
}
async function changeStatus(id,status){const {error}=await db.from("orders").update({status}).eq("id",id);if(error)alert(error.message);loadOrders()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
init();
</script>
</body>
</html>
